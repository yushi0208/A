<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>study tracker</title>

<style>

* {

  box-sizing: border-box;

}

body {

  margin: 0;

  background: #f5f5f5;

  color: #222;

  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;

}

.container {

  max-width: 700px;

  margin: auto;

  padding: 20px;

}

h1 {

  text-align: center;

  margin-bottom: 20px;

}

.card {

  background: white;

  border-radius: 16px;

  padding: 20px;

  margin-bottom: 20px;

  box-shadow: 0 3px 12px rgba(0,0,0,0.08);

}

.info {

  display: flex;

  justify-content: space-between;

  flex-wrap: wrap;

  gap: 10px;

  margin-bottom: 20px;

}

.info-box {

  background: #f3f3f3;

  padding: 10px 14px;

  border-radius: 10px;

}

.grid {

  display: grid;

  grid-template-columns: repeat(10, 1fr);

  gap: 6px;

  margin-top: 15px;

}

.cell {

  aspect-ratio: 1;

  border: 2px solid #ddd;

  border-radius: 6px;

  background: white;

}

.cell.filled {

  background: #222;

  border-color: #222;

}

.cell.animate {

  animation: fillAnimation 0.5s ease;

}

@keyframes fillAnimation {

  0% {

    transform: scale(0.5);

    opacity: 0;

  }

  60% {

    transform: scale(1.15);

    opacity: 1;

  }

  100% {

    transform: scale(1);

    opacity: 1;

  }

}

button {

  width: 100%;

  padding: 16px;

  border: none;

  border-radius: 12px;

  background: #222;

  color: white;

  font-size: 18px;

  font-weight: bold;

  cursor: pointer;

}

button:active {

  transform: scale(0.97);

}

.progress {

  text-align: center;

  font-size: 18px;

  margin-top: 15px;

}

/* クッキー */

.cookie-area {

  text-align: center;

  margin-top: 20px;

  min-height: 70px;

}

.cookie {

  display: inline-block;

  font-size: 45px;

  animation: cookieGet 0.6s ease;

}

@keyframes cookieGet {

  0% {

    transform: scale(0) rotate(-30deg);

    opacity: 0;

  }

  60% {

    transform: scale(1.3) rotate(10deg);

    opacity: 1;

  }

  100% {

    transform: scale(1) rotate(0);

    opacity: 1;

  }

}

.reward-message {

  font-size: 18px;

  font-weight: bold;

  margin-top: 5px;

}

/* クッキー総数 */

.cookie-count {

  text-align: center;

  font-size: 24px;

  font-weight: bold;

  margin-top: 10px;

}

/* 合計時間 */

.total {

  text-align: center;

  font-size: 22px;

  font-weight: bold;

}

/* 設定 */

.settings {

  margin-top: 20px;

}

input {

  width: 100%;

  padding: 12px;

  border: 1px solid #ccc;

  border-radius: 8px;

  font-size: 16px;

  margin-top: 8px;

}

.small-button {

  margin-top: 10px;

  padding: 10px;

  font-size: 14px;

}

/* リセットボタン */

.reset-button {

  background: #d9534f;

  margin-top: 10px;

}

</style>

</head>

<body>

<div class="container">

<h1>📚study tracker✏️</h1>

<!-- 基本情報 -->

<div class="card">

  <div class="info">

    <div class="info-box">

      開始日：<span id="startDate"></span>

    </div>

    <div class="info-box">

      カード：<span id="sheetNumber">1</span>枚目

    </div>

  </div>

  <div class="total">

    合計勉強時間：<span id="totalTime">0分</span>

  </div>

</div>

<!-- クッキー総数 -->

<div class="card">

  <div class="cookie-count">

    🍪 クッキー：<span id="cookieCount">0</span>枚

  </div>

</div>

<!-- 現在のカード -->

<div class="card">

  <h2>現在のカード</h2>

  <div class="grid" id="grid"></div>

  <div class="progress">

    <span id="progress">0</span> / 60 マス

  </div>

  <br>

  <button onclick="fillCell()">

    1マス塗りつぶす

  </button>

  <div class="cookie-area" id="cookieArea"></div>

</div>

<!-- 設定 -->

<div class="card settings">

  <h2>設定</h2>

  <label>

    1マス＝何分勉強したことにする？

  </label>

  <input

    type="number"

    id="minutesInput"

    min="1"

    value="25"

  >

  <button class="small-button" onclick="saveSettings()">

    設定を保存

  </button>

</div>

<!-- リセット -->

<div class="card">

  <h2>データリセット</h2>

  <button

    class="reset-button"

    onclick="resetData()"

  >

    🔄 すべてリセット

  </button>

</div>

</div>

<script>

/* =========================

   データ

========================= */

let data = {

  startDate: new Date().toISOString(),

  sheet: 1,

  count: 0,

  totalMinutes: 0,

  minutesPerCell: 25,

  cookies: 0

};

/* =========================

   保存データを読み込む

========================= */

const savedData =

  localStorage.getItem("studyCardData");

if (savedData) {

  data = JSON.parse(savedData);

}

/* =========================

   データを保存

========================= */

function saveData() {

  localStorage.setItem(

    "studyCardData",

    JSON.stringify(data)

  );

}

/* =========================

   開始日の表示

========================= */

function showStartDate() {

  const date = new Date(data.startDate);

  const year = date.getFullYear();

  const month = date.getMonth() + 1;

  const day = date.getDate();

  document.getElementById("startDate").textContent =

    year + "/" + month + "/" + day;

}

/* =========================

   合計時間の表示

========================= */

function showTotalTime() {

  const minutes = data.totalMinutes;

  const hours = Math.floor(minutes / 60);

  const restMinutes = minutes % 60;

  let text = "";

  if (hours > 0) {

    text += hours + "時間 ";

  }

  text += restMinutes + "分";

  document.getElementById("totalTime").textContent =

    text;

}

/* =========================

   クッキー数の表示

========================= */

function showCookieCount() {

  document.getElementById("cookieCount").textContent =

    data.cookies;

}

/* =========================

   グリッド作成

========================= */

function createGrid(animationIndex = -1) {

  const grid =

    document.getElementById("grid");

  grid.innerHTML = "";

  for (let i = 0; i < 60; i++) {

    const cell =

      document.createElement("div");

    cell.className = "cell";

    if (i < data.count) {

      cell.classList.add("filled");

    }

    if (i === animationIndex) {

      cell.classList.add("animate");

    }

    grid.appendChild(cell);

  }

  document.getElementById("progress").textContent =

    data.count;

  document.getElementById("sheetNumber").textContent =

    data.sheet;

}

/* =========================

   マスを1つ塗る

========================= */

function fillCell() {

  /* 60マス終わっていたら何もしない */

  if (data.count >= 60) {

    return;

  }

  /* 塗るマス */

  const animationIndex = data.count;

  data.count++;

  /* 勉強時間を追加 */

  data.totalMinutes +=

    data.minutesPerCell;

  /* 10マスごとにクッキー */

  if (data.count % 10 === 0) {

    getCookie();

  }

  saveData();

  createGrid(animationIndex);

  showTotalTime();

  showCookieCount();

  /* 60マス完成 */

  if (data.count === 60) {

    setTimeout(function() {

      nextSheet();

    }, 1800);

  }

}

/* =========================

   クッキーをゲット

========================= */

function getCookie() {

  data.cookies++;

  const area =

    document.getElementById("cookieArea");

  area.innerHTML = "";

  /* クッキー */

  const cookie =

    document.createElement("div");

  cookie.className = "cookie";

  cookie.textContent = "🍪";

  area.appendChild(cookie);

  /* メッセージ */

  const message =

    document.createElement("div");

  message.className =

    "reward-message";

  message.textContent =

    "1列完成！クッキーを1個ゲット！";

  area.appendChild(message);

}

/* =========================

   次のカード

========================= */

function nextSheet() {

  data.sheet++;

  data.count = 0;

  saveData();

  document.getElementById("cookieArea").innerHTML = "";

  createGrid();

}

/* =========================

   設定を保存

========================= */

function saveSettings() {

  const input =

    document.getElementById("minutesInput");

  const value =

    Number(input.value);

  if (value < 1) {

    return;

  }

  data.minutesPerCell = value;

  saveData();

  alert(

    "1マス " + value + "分に設定しました！"

  );

}

/* =========================

   データをリセット

========================= */

function resetData() {

  const result =

    confirm(

      "勉強時間、カード、クッキーなどのデータをすべてリセットしますか？"

    );

  if (!result) {

    return;

  }

  data = {

    startDate: new Date().toISOString(),

    sheet: 1,

    count: 0,

    totalMinutes: 0,

    minutesPerCell: 25,

    cookies: 0

  };

  saveData();

  document.getElementById("minutesInput").value =

    data.minutesPerCell;

  document.getElementById("cookieArea").innerHTML = "";

  showStartDate();

  showTotalTime();

  showCookieCount();

  createGrid();

}

/* =========================

   最初の表示

========================= */

document.getElementById("minutesInput").value =

  data.minutesPerCell;

showStartDate();

showTotalTime();

showCookieCount();

createGrid();

</script>

</body>

</html>
